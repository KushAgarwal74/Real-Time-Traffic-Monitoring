apiVersion: 1
groups:
    - orgId: 1
      name: Traffic‑Analytics
      folder: Traffic Analytics
      interval: 1m
      rules:
        - uid: afy0tpoc77if4d
          title: Vehicle count above 100
          condition: B
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: ffy0ik8xil7nkb
              model:
                dataset: traffic_db
                datasource:
                    type: grafana-postgresql-datasource
                    uid: ffy0ik8xil7nkb
                editorMode: code
                format: table
                intervalMs: 1000
                maxDataPoints: 43200
                rawQuery: true
                rawSql: |-
                    SELECT COUNT(DISTINCT track_id) AS vehicle_count
                    FROM traffic_events
                    WHERE event_time >= TIMESTAMPTZ '2026-09-01 08:25:00+00'
                      AND event_time < TIMESTAMPTZ '2026-09-01 08:30:00+00';
                refId: A
                sql:
                    columns:
                        - parameters: []
                          type: function
                    groupBy:
                        - property:
                            type: string
                          type: groupBy
                    limit: 50
                table: traffic_events
            - refId: B
              queryType: expression
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params: []
                        type: gt
                      operator:
                        type: and
                      query:
                        params: []
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                reducer: last
                refId: B
                type: reduce
            - refId: C
              queryType: expression
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 100
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: B
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: NoData
          execErrState: Error
          for: 1m
          isPaused: false
          notification_settings:
            receiver: empty
